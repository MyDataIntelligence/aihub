name: release
# npm trusted publishing (OIDC): no npm token in this repository. Only vX.Y.Z tags publish to npm; vscode-v* tags (the VS Code extension) do not.
on:
  push:
    branches: [staging]
    tags: ['v[0-9]*']
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cli } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint:skills
      - name: Publish next (staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          base=$(node -p "require('./package.json').version")
          npm version --no-git-tag-version "${base}-next.${GITHUB_RUN_NUMBER}"
          npm publish --access public --tag next --provenance
      - name: Publish latest (version tag)
        if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/vscode-')
        run: |
          npm version --no-git-tag-version "${GITHUB_REF_NAME#v}" --allow-same-version
          npm publish --access public --provenance
      - name: Attach the team pack to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/vscode-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          (cd ../team-pack && zip -r "../aihub-team-pack-${v}.zip" . -x '.DS_Store')
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "aihub $v" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "../aihub-team-pack-${v}.zip" --clobber
