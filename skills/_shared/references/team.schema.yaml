# Schema of the team file. Teams keep their copy in the team repository at
# .agents/skills/_shared/references/team.yaml (created by `aihub init`).
# Every key below is documented as "key: <type>  # meaning (required|optional)".
# The values shown are the generic defaults, not team knowledge.

version: 1                         # integer, schema version (required)
language: en                       # content language of stories, PRs, comments, e.g. en or nl (required)

azureDevOps:                       # where the CLI talks to (required)
  organization: <organization>     # Azure DevOps organization name (required)
  project: <project>               # project name (required)

repositories:                      # list (required, at least one)
  - name: <repository>             # exact repository name in Azure DevOps (required)
    aliases: []                    # list of short names users may say, e.g. ["tp"] (optional)
    defaultTarget: main            # branch a new PR targets (required)
    releaseBranches: []            # release branch patterns or names, e.g. ["release/*"] (optional)
    path: ../<repository>          # local clone, absolute or relative to this repository; default: sibling directory or temporary clone (optional)

pullRequest:                       # pull request settings (required)
  template: .azuredevops/pull_request_template.md   # path in the repo to the PR template (required)
  title: "{storyId}: {storyTitle}" # title pattern; placeholders {storyId} {storyTitle} {branch} (optional)
  emptySection: "-"                # text the CLI writes into a template section left empty (optional)

workItems:                         # work item settings (required)
  storyType: User Story            # work item type used for stories (required)
  storyTemplate: .agents/skills/_shared/assets/story-template.md   # story template path (required)
  templates:                       # optional: template path per work item type for `aihub workitem create`
    Bug: .agents/skills/_shared/assets/bug-template.md
    Task: .agents/skills/_shared/assets/task-template.md
  states:                          # optional: states set by story start / finish
    active: Active                 # set when a story is started (default Active)
    finished: Done                 # set when a story is finished (default Done)

branches:                          # branch rules (required)
  feature: "feature/{storyId}-{slug}"   # pattern for feature branches (required)
  protected:                            # branches the CLI never pushes to or force-updates (optional)
    - main
    - release/*

cherryPick:                        # cherry-pick settings (optional)
  groups:                          # named sets of target branches, usable as --to <group> (optional)
    supported: ["release/1.2", "release/1.3"]   # example group name and its target branches (optional)

pipelines:                         # pipelines to follow per repository (optional)
  - repository: <repository>      # repository name this pipeline belongs to
    name: <pipeline>               # pipeline name or id
    required: true                 # true when a red run blocks the PR
    purpose: validates main        # what this pipeline is for, one line (optional)
    yaml: ci/ci.yml               # the YAML file in the repository (optional)
    validates: ["main", "release/*"]   # branches this pipeline validates (optional)
    requiredTemplates: ["templates/test.yml"]   # templates the YAML must use; `aihub pipeline validate` reports a missing one (optional)

fabric:                            # Fabric workspaces for `aihub fabric` (optional)
  workspaces:                      # list of workspaces the CLI may know about
    - name: <workspace>            # workspace display name, e.g. DEV-test-project (optional)
      id: <guid>                   # workspace id (optional; looked up by name when absent)
      environment: dev             # dev | feature | test | acc | prd (optional); acc and prd are never run by the CLI
      branches: []                 # branch patterns tested in this workspace, e.g. ["feature/*"]; several matches run in each (optional)
  environments:                    # which git branch and deployment pipeline stage an environment is, for `aihub release plan --from DEV --to ACC` (optional)
    DEV:                           # environment name you say (DEV, ACC, ...)
      branch: develop              # git branch that holds it (optional; needed for release plan --from/--to)
      stage: Development           # deployment pipeline stage name or order, default the environment name (optional)
  deploymentPipeline: <pipeline>   # Fabric deployment pipeline whose stage items are compared for new/deleted items (optional; without it the plan is git only)
  workspaceGroups:                 # named sets of workspaces for `aihub fabric run --workspaces <name>` (optional)
    <group>: []                    # group name and the workspace names in it, e.g. [DEV-anna, DEV-shared] (optional)

robot:                             # Robot integration tests for `aihub robot` (optional)
  pipeline: <pipeline>             # Azure DevOps pipeline that runs the Robot suites (optional; needed for robot run)
  defaultTarget: <target>          # name in targets used when robot run has no --on (optional)
  targets:                         # named places to run Robot, e.g. feature and staging (optional)
    <target>:                      # the name you say: "draai Robot op <target>"
      branch: <branch>             # branch the pipeline runs on (optional)
      mergeMyBranchFirst: true     # true: merge my current branch into this branch and push it first; false: run it as is (optional)
      mustAlreadyContain: []       # branches that must already be merged into this branch, e.g. ["staging"] (optional)
  integrationBranch: <branch>      # older form: one branch that gets my branch merged, used without targets (optional)
  integrationBranches: []          # older form per repository: [{ repository, branch, requires }] (optional)
  integrationRequires: []          # older form: branches the integration branch must already contain (optional)
  suites:                          # list; a suite belongs to a flow (optional; needed for robot needed)
    - name: <suite>                # suite name passed to the pipeline as parameter `suite` (optional)
      paths: []                    # path patterns of the flow, e.g. ["src/flows/orders/**"] (optional)
      tests: []                    # path patterns of the suite's Robot files, e.g. ["tests/robot/orders/**"] (optional)

dataChecks:                        # optional: used by `aihub pr data-diff` (read-only numbers before/after in the PR)
  item: <lakehouse-or-warehouse>   # Warehouse or Lakehouse (name) that exists in the baseline and the feature workspace; needed as soon as dataChecks is used
  itemType: Lakehouse              # Lakehouse (default) or Warehouse; a lakehouse name is ambiguous with its SQL endpoint, so the type is always passed (optional)
  baseline: <workspace>            # workspace with the baseline data; default: the fabric.workspaces entry of the PR's target branch, else the dev workspace (optional)
  feature: <workspace>             # workspace of the branch; default: the fabric.workspaces entry whose branches match the PR's source branch (optional)
  section: "Data before/after"     # PR section heading, default "Data before/after" (nl: "Data vóór/na") (optional)
  tables:                          # what to measure per table
    - name: gold.orders            # schema.table
      count: true                  # row count (default true)
      nulls: [customer_id]         # NULL count per column
      sums: [amount]               # SUM per column
      distinct: [customer_id]      # COUNT(DISTINCT) per column
      sql: ""                      # optional custom SELECT returning one row; every column becomes a metric

crossRepo:                         # cross-repo settings for `aihub port` and `aihub crossrepo` (optional)
  pathMaps:                        # named path mappings, usable as `aihub port --map <name>` (optional)
    <name>:                        # the name you say: "port naar developers" (optional)
      - from: src/app              # directory prefix in the source repository (optional)
        to: lib/app                # directory prefix in the target repository (optional)
  testTarget:                      # where test resources go by default (optional)
    repo: <repository>             # repository that receives the test resources (optional)
    branch: <branch>               # its active test branch; never a protected branch (optional)
  testResources:                   # which files are copied (optional)
    fromRepo: <repository>         # repository the resources come from (optional)
    paths: ["tests/data/**"]       # globs, relative to the source repository root (optional)
    toPath: ""                     # directory prefix in the target repository, default none (optional)

guidelines:                       # list of repo files the agent reads before writing code or text (optional)
  - docs/guidelines.md

tests:                             # optional: used by `aihub test changed` (the tests that belong to the changed files)
  command: "pytest {tests}"        # command template; {tests} becomes the test files to run (default: pytest for .py, npx vitest run for JS/TS)
  map:                             # optional rules for code the name/import heuristics do not match
    - source: "etl/**"             # changed files matching these globs (a string or a list) ...
      tests: "tests/etl/**"        # ... run the repository files matching these globs

commits:                           # optional: used by `aihub commit`
  format: "{type}({scope}): {subject} (AB#{storyId})"   # placeholders {type} {scope} {subject} {storyId}; (scope) and the AB# part vanish when unknown
  types: [feat, fix, docs, test, chore, refactor]       # allowed --type values
  scope: ""                        # fixed scope; default: the most common top-level folder of the changed files
